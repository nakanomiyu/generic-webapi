<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Debate Battle</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        #debate-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .bubble { max-width: 70%; margin: 10px; padding: 15px; border-radius: 15px; position: relative; line-height: 1.5; }
        .affirmative { align-self: flex-start; background: #e74c3c; color: white; border-bottom-left-radius: 2px; }
        .negative { align-self: flex-end; background: #3498db; color: white; border-bottom-right-radius: 2px; }
        .input-area { background: white; padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <div class="header"><h1>🔥 AIディベートバトル</h1></div>
    <div id="debate-box"></div>
    <div class="input-area">
        <input type="text" id="topic" placeholder="討論のお題を入力（例：きのこ vs たけのこ）">
        <button id="btn" onclick="nextTurn()">議論を進める</button>
    </div>

    <script>
        let lastArgument = "まだ議論は始まっていません。";
        let currentStance = "肯定派"; // 最初は肯定派から

        async function nextTurn() {
            const topic = document.getElementById('topic').value;
            if (!topic) return alert("お題を入力してください");

            const btn = document.getElementById('btn');
            btn.disabled = true;

            try {
                const response = await fetch('/api/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        topic: topic,
                        last_argument: lastArgument,
                        stance: currentStance
                    })
                });

                const result = await response.json();
                const aiData = result.data[0];

                addBubble(aiData.argument, currentStance);

                // 次のターンの準備
                lastArgument = aiData.argument;
                currentStance = (currentStance === "肯定派") ? "否定派" : "肯定派";

            } catch (error) {
                alert("エラーが発生しました: " + error.message);
            } finally {
                btn.disabled = false;
            }
        }

        function addBubble(text, stance) {
            const box = document.getElementById('debate-box');
            const div = document.createElement('div');
            div.className = `bubble ${stance === '肯定派' ? 'affirmative' : 'negative'}`;
            div.innerHTML = `<strong>${stance}</strong><br>${text}`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
